<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalo GPS Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f0f2f5; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        #map { height: 300px; width: 100%; margin-top: 10px; border-radius: 8px; }
        .info { font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="card">
    <div class="info" id="status">Đang tự động quét tọa độ GPS...</div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, marker;

    // Tự động chạy ngay khi người dùng mở link trong Zalo
    window.addEventListener('DOMContentLoaded', () => {
        autoGetGPS();
    });

    function autoGetGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const accuracy = pos.coords.accuracy;

                    document.getElementById('status').innerHTML = 
                        `<b>Đã xác thực vị trí!</b><br>` +
                        `<b>Tọa độ:</b> ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>` +
                        `<b>Sai số:</b> ~${Math.round(accuracy)} mét`;

                    showMap(lat, lon);
                    sendGpsToServer(lat, lon); // Gửi dữ liệu về Server nếu cần
                },
                (err) => {
                    document.getElementById('status').innerHTML = 
                        `<span style="color:red">Chưa lấy được GPS: ${err.message}</span>`;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    }

    function showMap(lat, lon) {
        if (!map) {
            map = L.map('map').setView([lat, lon], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        } else {
            map.setView([lat, lon], 17);
        }
        if (marker) marker.setLatLng([lat, lon]);
        else marker = L.marker([lat, lon]).addTo(map);
    }

    // Hàm gửi tọa độ về Backend/API của bạn
    function sendGpsToServer(lat, lon) {
        /*
        fetch('https://api.yourdomain.com/save-location', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ latitude: lat, longitude: lon, time: new Date() })
        });
        */
        console.log("Dữ liệu sẵn sàng gửi:", lat, lon);
    }
</script>
</body>
</html>
